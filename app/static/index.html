hits,parties,struct}}const extras=['Mulheres nomeadas','Titulares que permanecem','Partidos representados','Titulares sem filiação'];function extraFields(s,obj){return extras.map((x,i)=>field(x,String(i),obj?.[i],s,0,'number')).join('')}function render(){if(tab===5&&isAdmin){queueMicrotask(loadUsers);queueMicrotask(loadCustom);}clearInterval(rankingTimer);if(tab===3)rankingTimer=setInterval(loadRanking,15000); $('nav').innerHTML=tabs.map((x,i)=>!isAdmin&&i===5?'':`<button class="${tab===i?'':'alt'}" data-tab="${i}">${x}</button>`).join('')+'<button class="alt" id="logout">Sair</button>';let d=state.draft,m=$('main');if(tab===0)m.innerHTML=`<section><h2>Seu desafio começa aqui</h2><div class="stats"><article><strong>${d.total}</strong>Previsão de pastas</article><article><strong>${state.players.length}</strong>Participantes</article><article><strong>${state.locked?'Encerrado':'Aberto'}</strong>Status</article></div><p>Comece com 30 pastas de referência e personalize sua previsão. Crie, extinga, funda, divida ou renomeie pastas. Preencha os nomes e partidos que deseja prever.</p><button data-tab="1">Montar meu governo</button></section>`;if(tab===1)m.innerHTML=state.locked?'<section>Rodada encerrada.</section>':`<section><h2>Monte seu governo</h2>${isAdmin?field('Apelido','nick',d.nick,'draft',0):'<p>Conta: '+esc(d.nick)+'</p>'}${state.extrasLocked?'<p>Total bloqueado: '+esc(d.total)+'</p>':field('Total previsto de ministérios','total',d.total,'draft',0,'number')}<small>${d.rows.length} registros. Use os registros pré-cadastrados ou adicione outros. Mudanças estruturais podem envolver mais de uma pasta.</small></section>${d.rows.map((r,i)=>row(r,i,'rows')).join('')}<button data-add="rows">+ Adicionar ministério</button> <button class="alt" id="loadref">Carregar pastas de referência</button> <button id="submit">Salvar aposta</button><p id="msg"></p>`;if(tab===2)m.innerHTML=state.locked||state.extrasLocked?'<section>Rodada encerrada.</section>':`<section><h2>Palpites ex $('nav').onclick=$('main').onclick=async e=>{let t=e.target;if(t.id==='refreshCustom'){await loadCustom();return}if(t.dataset.custom!==undefined){if(state.final){alert('Apuração finalizada');return}let r=window.customRows?.[Number(t.dataset.custom)];if(!r)return;if(state.official.some(x=>norm(x.n)===norm(r.name))){alert('Pasta já cadastrada');return}state.official.push({...empty(),n:r.name,a:'Criar'});save();render();return}if(t.dataset.unlock!==undefined||t.dataset.annul!==undefined||['unlockAll','unlockExtras','restartGame','backupDb'].includes(t.id)){let action=t.dataset.unlock!==undefined?'unlock':t.dataset.annul!==undefined?'annul':({unlockAll:'unlock_all',unlockExtras:'unlock_extras',restartGame:'reset',backupDb:'backup'})[t.id];let clearBets=!!$('clearBets')?.checked;let confirmation;if(action==='reset'||action==='annul'){confirmation=prompt(action==='reset'?'Remove todos os resultados e bloqueios. '+(clearBets?'APAGA todas as apostas. ':'Preserva apostas. ')+'Digite REINICIAR para confirmar':'Anular resultado sem reabrir a pasta. Digite REINICIAR');if(confirmation!=='REINICIAR')return;}else if(action!=='backup'&&!confirm('Confirmar desbloqueio? Use somente antes de anúncios públicos.'))return;await queue;if(blocked)return;try{let j=await api('/api/competition-control',{action,revision,name:t.dataset.unlock??t.dataset.annul,confirm:confirmation,clearBets});if(action==='backup'){alert('Backup salvo no servidor: '+j.backup);return}location.reload()}catch(e){alert(e.message)}return}if(t.id==='resetTests'){if(!confirm('Faça backup antes. Limpar todos os resultados e bloqueios de teste?'))return;let confirmation=prompt('Digite LIMPAR TESTES');if(confirmation!=='LIMPAR TESTES')return;await queue;try{await api('/api/reset-test',{confirm:confirmation});location.reload()}catch(e){alert(e.message)}return}if(t.id==='reviewNames'){try{let a=await api('/api/name-review');$('nameReview').innerHTML=a.map((x,i)=>`<article><b>${esc(x.pasta)}</b><p>${esc(x.name)} → ${esc(x.official)} · ${x.similarity}% · ${x.count} aposta(s)</p><button class=alt data-review=${i}>${x.approved?'Revogar equivalência':'Confirmar equivalência'}</button></article>`).join('')||'Nenhuma divergência encontrada';window.reviewRows=a}catch(e){alert(e.message)}return}if(t.dataset.review!==undefined){let x=window.reviewRows[+t.dataset.review];if(!confirm('Confirmar alteração da equivalência?'))return;await queue;try{await api('/api/name-review',{...x,approve:!x.approved});location.reload()}catch(e){alert(e.message)}return}if(t.dataset.user){let action=t.dataset.action;if(!confirm('Confirmar operação: '+action+'?'))return;let password=action==='password'?prompt('Nova senha (mínimo 10 caracteres)'):undefined;if(action==='password'&&!password)return;try{await api('/api/users/'+t.dataset.user,{action,password,confirm:action==='purge'?prompt('Digite EXCLUIR para apagar definitivamente'):undefined});await loadUsers()}catch(e){alert(e.message)}return}if(t.dataset.lockpasta!==undefined||t.id==='lockExtras'){await queue;if(blocked)return;let r=state.official[Number(t.dataset.lockpasta)];if(r&&!r.n.trim()){alert('Informe o nome da pasta');return}let related=r&&['Fundir','Dividir','Renomear'].includes(r.a)?prompt('Pastas relacionadas (nomes exatos separados por ponto e vírgula)'):'';if(related===null)return;if(!confirm('Bloquear permanentemente os palpites selecionados e os extras?'))return;try{let j=await api('/api/lock-pasta',{revision,names:r?[r.n,...related.split(';')]:[]});revision=j.revision;state.lockedPastas=j.state.lockedPastas;state.extrasLocked=true;render()}catch(e){alert(e.message)}return}if(t.dataset.publish!==undefined||t.id==='publishExtras'){await queue;if(blocked)return;try{let rr=state.official[Number(t.dataset.publish)];let related=rr&&['Fundir','Dividir','Renomear'].includes(rr.a)?prompt('Pastas relacionadas (nomes exatos separados por ponto e vírgula)'):'';if(related===null)return;if(!confirm('Publicar e bloquear os palpites envolvidos?'))return;let j=await api('/api/publish',{related:related.split(';'),revision,index:t.dataset.publish===undefined?undefined:Number(t.dataset.publish),extras:t.id==='publishExtras'});revision=j.revision;state.official=j.state.official;state.published=j.state.published;state.publishedExtras=j.state.publishedExtras;state.lockedPastas=j.state.lockedPastas;state.extrasLocked=j.state.extrasLocked;render();alert('Resultado publicado. Ranking atualizado.')}catch(e){alert(e.message)}return}if(t.id==='logout'){fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(()=>location.reload());return}if(t.dataset.tab!==undefined){tab=+t.dataset.tab;render();if(tab===5&&isAdmin)loadUsers()}if(state.final&&(t.dataset.add==='official'||t.dataset.remove?.startsWith('official:')||t.id==='loadOfficial')){alert('Reabra a apuração primeiro.');return}if(t.dataset.add){(t.dataset.add==='rows'?state.draft.rows:state.official).push(empty());save();render()}if(t.dataset.remove){let [s,i]=t.dataset.remove.split(':');if(s==='official'&&state.official[+i]?.publishedKey){alert('Registro publicado: corrija e publique novamente.');return;}(s==='rows'?state.draft.rows:state.official).splice(+i,1);save();render()}if(t.id==='saveref'){state.reference=$('ref').value.split('\n').map(x=>x.trim()).filter(Boolean);save();render()}if(t.id==='loadref'){for(const n of state.reference)if(!(state.lockedPastas||[]).includes(norm(n))&&!state.draft.rows.some(r=>norm(r.n)===norm(n)))state.draft.rows.push({...empty(),n});save();render()}if(t.id==='saveExtras'&&!state.locked){let values=Object.values(state.draft.extras||{});if(values.some(v=>v!==''&&(!Number.isInteger(Number(v))||Number(v)<0))){$('extraMsg').textContent='Informe apenas números inteiros não negativos.';return}if(state.edit!==null&&state.players[state.edit])state.players[state.edit].extras=JSON.parse(JSON.stringify(state.draft.extras||{}));save();$('extraMsg').textContent='Palpites extras enviados para gravação; confira o aviso do servidor.';}if(t.id==='submit'){if(isAdmin){alert('Use uma conta de participante para apostar.');return}let d=state.draft;if(!d.nick.trim()||!Number.isInteger(+d.total)||+d.total<1||!d.rows.length||d.rows.some(r=>!r.n.trim()||!r.a)||new Set(d.rows.map(r=>norm(r.n))).size!==d.rows.length){$('msg').textContent='Preencha apelido, total inteiro positivo e registros com nomes únicos e ação definida.';return}if(state.players.some((p,i)=>norm(p.nick)===norm(d.nick)&&i!==state.edit)){$('msg').textContent='Apelido já cadastrado.';return}let p=JSON.parse(JSON.stringify(d));let frozen=state.lockedPastas||[];p.rows=p.rows.filter(r=>!frozen.includes(norm(r.n))).concat((state.players[0]?.rows||[]).filter(r=>frozen.includes(norm(r.n))));if(state.extrasLocked){p.extras=state.players[0]?.extras||{};p.total=state.players[0]?.total??40;}if(!isAdmin){state.players=[p];state.edit=0;}else{if(state.edit===null)state.players.push(p);else state.players[state.edit]=p;state.edit=null;state.draft={nick:'',total:40,rows:initialRows().filter(x=>!(state.lockedPastas||[]).includes(norm(x.n))),extras:{}};}tab=3;save();render()}if(t.dataset.edit!==undefined&&isAdmin){alert('Apostas de participantes são editadas nas próprias contas.');return}if(t.dataset.edit!==undefined){state.edit=+t.dataset.edit;state.draft=JSON.parse(JSON.stringify(state.players[state.edit]));tab=1;save();render()}if(t.id==='lock'&&confirm('Encerrar todos os palpites?')){state.locked=true;if(!state.official.length)state.official=initialRows();save();render()}if(t.id==='loadOfficial'){for(const n of state.reference)if(!state.official.some(r=>norm(r.n)===norm(n)))state.official.push({...empty(),n});save();render()}if(t.id==='finish'){if(!state.final&&state.official.some(r=>!r.source?.trim()||(r.a!=='Extinguir'&&(!r.person?.trim()||!r.party?.trim()||!r.status)))){alert('Preencha titular, partido, situação e fonte de todos os resultados antes de finalizar.');return}if(!state.final&&(!state.official.length||!Number.isInteger(+state.total)||+state.total<1||state.official.some(r=>!r.n.trim()||!r.a)||new Set(state.official.map(r=>norm(r.n))).size!==state.official.length)){alert('Confira os registros oficiais e o total antes de finalizar.');return}await queue;if(blocked)return;let next={...state,final:!state.final};let r=await fetch(endpoint,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision,state:next})});if(!r.ok){alert((await r.json()).detail);return}revision=(await r.json()).revision;state.final=next.final;render();loadUsers()}if(t.id==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='esplanada-backup.json';a.click();URL.revokeObjectURL(a.href)}};
$('main').addEventListener('input',e=>{let {s,i,k}=e.target.dataset;if(!s)return;if(state.final&&['official','state','officialExtras'].includes(s)){render();return}let o=s==='rows'?state.draft.rows[i]:s==='official'?state.official[i]:s==='draft'?state.draft:s==='state'?state:s==='extras'?(state.draft.extras??={}):(state.extras??={});o[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();if(k==='a')render()});render();
})().catch(e=>{document.getElementById('main').textContent='Não foi possível conectar ao servidor: '+e.message;});
</script></html>
