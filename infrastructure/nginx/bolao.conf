# Modelo de referência, não instalar durante GER-004.
server {
    listen 80;
    server_name bolao.alrjunior.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name bolao.alrjunior.com.br;
    ssl_certificate /etc/letsencrypt/live/bolao.alrjunior.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolao.alrjunior.com.br/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8015;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
